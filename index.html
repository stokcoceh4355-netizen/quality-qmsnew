function W(){if(D.length==0){alert('Belum ada laporan!');return;}var txt='LAPORAN QMS%0A';for(var i=0;i<D.length;i++){var o=D[i];txt+=(i+1)+'. '+o.c+' | '+o.p+' | Kekurangan:'+o.k+' | '+o.t+'%0A';}txt+='%0A'+D[0].dt;window.open('https://wa.me/?text='+txt,'_blank');}
function G(){
  if(D.length==0){alert('Belum ada laporan!');return;}
  var c=document.getElementById('v');
  var x=c.getContext('2d');
  // Lebar kolom baru - KET dilebarin, PART NO dikecilin dikit
  var cols=[90, 170, 280, 170, 240, 230]; // total 1180, sama kayak dulu
  var W = cols.reduce((a,b)=>a+b,0);
  var headH=62;
  c.width=W+20;
  // Hitung tinggi dulu biar KET yang panjang bisa 2 baris
  function wrapText(text, maxW, font){
    x.font = font;
    var words = text.split(' ');
    var lines = [];
    var cur = '';
    // Kalau ada kata panjang tanpa spasi kayak Pending/Abnormal, pecah paksa
    words.forEach(function(w){
      var test = cur ? cur + ' ' + w : w;
      if(x.measureText(test).width > maxW && cur){
        lines.push(cur);
        cur = w;
      } else {
        cur = test;
      }
      // Pecah kata yang kepanjangan sendiri
      while(x.measureText(cur).width > maxW && cur.length > 1){
        var cut = cur.length;
        while(cut > 0 && x.measureText(cur.slice(0,cut)).width > maxW) cut--;
        if(cut < 1) cut = 1;
        lines.push(cur.slice(0,cut));
        cur = cur.slice(cut);
      }
    });
    if(cur) lines.push(cur);
    return lines;
  }

  var rowsData = [];
  var totalH = 0;
  for(var i=0;i<D.length;i++){
    var o=D[i];
    var ketLines = wrapText(o.t, cols[4]-36, 'bold 20px Arial');
    var rowH = ketLines.length > 1 ? 78 : 58;
    rowsData.push({o:o, ketLines:ketLines, rowH:rowH});
    totalH += rowH;
  }

  c.height=70+headH+totalH+80;
  x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
  x.fillStyle='#1e40af';x.fillRect(0,0,c.width,50);
  x.fillStyle='#fff';x.font='bold 22px Arial';x.fillText('LAPORAN KEKURANGAN DELIVERY -  QUALITY DEPARTEMEN - '+dT(),20,33);
  
  var y=70;
  x.fillStyle='#1e40af';x.fillRect(10,y,W,headH);
  x.fillStyle='#fff';x.font='bold 20px Arial';
  var headers=['NO','CUSTOMER','PART NO','KEKURANGAN','KET','WAKTU'];
  var pos=[10];
  for(var i=0;i<cols.length;i++) pos.push(pos[i]+cols[i]);

  for(var i=0;i<headers.length;i++){
    x.fillText(headers[i], pos[i]+18, y+40);
  }
  y+=headH;
  for(var i=0;i<rowsData.length;i++){
    var o=rowsData[i].o;
    var ketLines=rowsData[i].ketLines;
    var rowH=rowsData[i].rowH;
    x.fillStyle=i%2==0?'#dbeafe':'#ffffff';
    x.fillRect(10,y,W,rowH);
    x.strokeStyle='#94a3b8';x.lineWidth=1.5;
    x.strokeRect(10,y,W,rowH);
    for(var j=1;j<pos.length-1;j++){
      x.beginPath();x.moveTo(pos[j],y);x.lineTo(pos[j],y+rowH);x.stroke();
    }
    var datas=[(i+1).toString(), o.c, o.p, o.k.toString(), o.t, o.dt];
    for(var j=0;j<datas.length;j++){
      if(j==3){
        x.fillStyle='#dc2626';x.font='bold 24px Arial';
        var tw=x.measureText(datas[j]).width;
        x.fillText(datas[j], pos[j]+(cols[j]-tw)/2, y+38);
      }else if(j==4){
        // KET - bisa 2 baris, tetep bold 20px
        x.fillStyle='#000';x.font='bold 20px Arial';
        if(ketLines.length==1){
          x.fillText(ketLines[0], pos[j]+18, y+38);
        }else{
          x.fillText(ketLines[0], pos[j]+18, y+30);
          x.fillText(ketLines[1], pos[j]+18, y+56);
        }
      }else{
        x.fillStyle='#000';x.font='bold 20px Arial';
        x.fillText(datas[j], pos[j]+18, y+38);
      }
    }
    y+=rowH;
  }
  if(D[D.length-1].n){y+=25;x.fillStyle='#000';x.font='bold 20px Arial';x.fillText('Catatan: '+D[D.length-1].n,15,y);}
  lastImg=c.toDataURL('image/png');
  document.getElementById('imgPrev').src=lastImg;
  document.getElementById('prev').style.display='block';
}
