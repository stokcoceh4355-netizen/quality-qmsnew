SIMPAN_RIWAYAT();}

window.onload=function(){R();var n=localStorage.getItem('qms_note');if(n){document.getElementById('ct').value=n;}var a=localStorage.getItem('qms_isAdmin');if(a=='1'){isA=true;document.getElementById('ad').style.display='block';document.getElementById('lb').innerText='ADMIN AKTIF';document.getElementById('lb').style.background='green';}document.getElementById('ct').addEventListener('input',saveAll);};
function BUKA_RIWAYAT(){document.getElementById('riwBox').style.display='block';var el=document.getElementById('riwList');el.innerHTML='Memuat...';if(typeof db==='undefined'||!db){el.innerHTML='Firebase belum aktif';return;}db.collection('riwayat_qms').orderBy('ts','desc').limit(30).get().then(function(snap){if(snap.empty){el.innerHTML='Belum ada riwayat. Klik JADI GAMBAR dulu.';return;}var h='<button onclick="HAPUS_SEMUA()" style="background:#d00;color:#fff;border:0;padding:8px 12px;border-radius:8px;width:100%;margin-bottom:10px;font-weight:bold">HAPUS SEMUA</button>';snap.forEach(function(doc){var d=doc.data();h+='<div style="border:2px solid #e98a7a;margin-bottom:12px;padding:8px;border-radius:8px"><b>'+(d.tgl||'')+'</b> - '+(d.jumlah||0)+' laporan <button onclick="HAPUS_SATU(\''+doc.id+'\')" style="background:#d00;color:#fff;border:0;padding:4px 8px;border-radius:6px;float:right">Hapus</button><br>';if(d.img)h+='<img src="'+d.img+'" style="width:100%;border:1px solid #000">';h+='</div>';});el.innerHTML=h;});}
function HAPUS_SATU(id){if(!confirm('Hapus laporan ini?'))return;db.collection('riwayat_qms').doc(id).delete().then(function(){BUKA_RIWAYAT();});}
function HAPUS_SEMUA(){if(!confirm('Hapus SEMUA riwayat?'))return;db.collection('riwayat_qms').get().then(function(snap){snap.forEach(function(doc){doc.ref.delete();});BUKA_RIWAYAT();});}
function SIMPAN_RIWAYAT(){if(typeof db==='undefined'||!db||!lastImg)return;try{var kecil=document.getElementById('v').toDataURL('image/jpeg',0.65);var ringkas=D.map(function(o,i){return (i+1)+'. '+o.c+' | '+o.p+' | '+o.k+' | '+o.t;}).join('\n');db.collection('riwayat_qms').add({img:kecil,tgl:dT(),ts:Date.now(),jumlah:D.length,isi:ringkas});}catch(e){}}
</script>
